<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>What's My ER Personality?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090c11;
    --bg-2:#0d1119;
    --glass:rgba(255,255,255,.045);
    --glass-strong:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.09);
    --red:#ff3653;
    --red-glow:rgba(255,54,83,.38);
    --cyan:#2be8ce;
    --text:#f3f5f8;
    --dim:#8b93a8;
    --dim-2:#5a6172;
    --radius:22px;
    --serif-none: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(80% 60% at 50% -10%, rgba(255,54,83,.10), transparent 60%),
      radial-gradient(60% 40% at 85% 110%, rgba(43,232,206,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  #app{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:0 20px;
  }

  /* ambient ECG line behind everything */
  .ecg-wrap{
    position:fixed; inset:0; z-index:0; opacity:.16; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .ecg-wrap svg{width:140%; max-width:900px;}
  .ecg-line{
    fill:none; stroke:var(--red); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:1400; stroke-dashoffset:1400;
    animation:draw 3.4s ease-in-out infinite;
  }
  @keyframes draw{
    0%{stroke-dashoffset:1400;}
    55%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:-1400;}
  }

  .screen{
    position:relative; z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    padding-top:max(48px, env(safe-area-inset-top));
    padding-bottom:max(32px, env(safe-area-inset-bottom));
    animation:fadeIn .5s ease both;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .hidden{display:none !important;}

  .eyebrow{
    font-family:var(--serif-none);
    font-size:13px;
    letter-spacing:.14em;
    color:var(--red);
    font-weight:600;
    margin:0 0 14px;
  }

  /* ---------- LANDING ---------- */
  #landing{justify-content:center; text-align:center; gap:0;}
  .siren{font-size:52px; display:inline-block; animation:pulseSiren 1.6s ease-in-out infinite;}
  @keyframes pulseSiren{0%,100%{transform:scale(1); filter:drop-shadow(0 0 0 rgba(255,54,83,0));} 50%{transform:scale(1.08); filter:drop-shadow(0 0 18px var(--red-glow));}}
  h1.landing-title{
    font-family:var(--serif-none);
    font-weight:700;
    font-size:clamp(34px, 9vw, 48px);
    line-height:1.06;
    letter-spacing:-.01em;
    margin:20px 0 14px;
  }
  .landing-sub{
    color:var(--dim);
    font-size:16px;
    line-height:1.5;
    max-width:320px;
    margin:0 auto 40px;
  }
  .cta-primary{
    appearance:none; border:none; cursor:pointer;
    font-family:var(--serif-none);
    font-weight:700;
    font-size:17px;
    color:#0a0508;
    background:linear-gradient(135deg, #ff5069, var(--red));
    padding:18px 30px;
    border-radius:100px;
    box-shadow:0 12px 30px -8px var(--red-glow);
    width:100%;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta-primary:active{transform:scale(.97); box-shadow:0 6px 16px -6px var(--red-glow);}
  .landing-foot{
    margin-top:18px;
    color:var(--dim-2);
    font-size:13px;
    letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .progress-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .qcount{font-family:var(--serif-none); font-weight:600; font-size:13px; letter-spacing:.08em; color:var(--dim);}
  .progress-track{
    width:100%; height:6px; border-radius:100px; background:var(--glass);
    border:1px solid var(--border); overflow:hidden; margin-bottom:34px;
  }
  .progress-fill{
    height:100%; border-radius:100px;
    background:linear-gradient(90deg, var(--red), #ff8a6b);
    transition:width .5s cubic-bezier(.65,0,.35,1);
    box-shadow:0 0 12px var(--red-glow);
  }
  .question-text{
    font-family:var(--serif-none);
    font-weight:600;
    font-size:clamp(21px, 6vw, 25px);
    line-height:1.28;
    margin:0 0 26px;
  }
  .answers{display:flex; flex-direction:column; gap:12px;}
  .answer-card{
    text-align:left;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 18px;
    font-size:15.5px;
    line-height:1.4;
    color:var(--text);
    cursor:pointer;
    display:flex; align-items:center; gap:14px;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .answer-card:active{transform:scale(.985);}
  .answer-card:hover{background:var(--glass-strong); border-color:rgba(255,54,83,.35);}
  .answer-card .letter{
    flex:0 0 auto;
    width:30px; height:30px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif-none); font-weight:600; font-size:13px;
    background:rgba(255,255,255,.06); color:var(--dim);
    border:1px solid var(--border);
  }
  .answer-card.selected{
    border-color:var(--red);
    background:linear-gradient(135deg, rgba(255,54,83,.14), rgba(255,54,83,.05));
    animation:pulseSelect .32s ease;
  }
  .answer-card.selected .letter{background:var(--red); color:#0a0508; border-color:var(--red);}
  @keyframes pulseSelect{0%{transform:scale(1);} 45%{transform:scale(1.02);} 100%{transform:scale(1);}}

  .quiz-nav{margin-top:auto; padding-top:28px;}
  .back-link{
    background:none; border:none; color:var(--dim-2); font-size:13px; cursor:pointer;
    padding:8px 0; font-family:'Inter', sans-serif;
  }

  /* ---------- LOADING ---------- */
  #loading{align-items:center; justify-content:center; text-align:center; gap:18px;}
  .pulse-ring{
    width:74px; height:74px; border-radius:50%;
    border:3px solid rgba(255,54,83,.25); border-top-color:var(--red);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{font-family:var(--serif-none); font-weight:600; font-size:15px; letter-spacing:.06em; color:var(--dim);}

  /* ---------- RESULT ---------- */
  #result{padding-top:max(40px, env(safe-area-inset-top)); text-align:center;}
  .result-kicker{
    font-family:var(--serif-none); font-weight:600; font-size:13px; letter-spacing:.14em;
    color:var(--dim); margin-bottom:14px;
  }
  .result-emoji{
    font-size:64px; margin-bottom:6px;
    animation:emojiPop .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes emojiPop{0%{transform:scale(.4) rotate(-8deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;}}
  .result-name{
    font-family:var(--serif-none); font-weight:700;
    font-size:clamp(28px,8vw,36px); line-height:1.08; margin:4px 0 14px;
    background:linear-gradient(135deg, #fff, #ffb4bd);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .result-line{
    font-size:16px; color:var(--dim); line-height:1.5; max-width:320px; margin:0 auto 28px; font-style:italic;
  }
  .trait-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .trait-card{
    background:var(--glass); border:1px solid var(--border); border-radius:14px;
    padding:14px 12px; font-size:13.5px; line-height:1.35; text-align:left;
  }
  .quote-block{
    background:linear-gradient(135deg, rgba(255,54,83,.09), rgba(43,232,206,.05));
    border:1px solid rgba(255,54,83,.2);
    border-radius:18px; padding:20px 18px; margin-bottom:28px;
    font-family:var(--serif-none); font-weight:500; font-size:15.5px; line-height:1.45;
  }
  .quote-block span{color:var(--red);}

  .share-btn{
    appearance:none; border:none; cursor:pointer; width:100%;
    font-family:var(--serif-none); font-weight:700; font-size:16px; color:#0a0508;
    background:linear-gradient(135deg, #ff5069, var(--red));
    padding:17px 20px; border-radius:100px; margin-bottom:12px;
    box-shadow:0 12px 26px -8px var(--red-glow);
    transition:transform .15s ease;
  }
  .share-btn:active{transform:scale(.97);}
  .retake-btn{
    appearance:none; border:1px solid var(--border); cursor:pointer; width:100%;
    background:var(--glass); color:var(--text);
    font-family:var(--serif-none); font-weight:600; font-size:15px;
    padding:15px 20px; border-radius:100px; margin-bottom:18px;
  }
  .disclaimer{
    font-size:11.5px; color:var(--dim-2); line-height:1.5; margin-bottom:8px;
  }
  .handle{font-size:12px; color:var(--dim-2); letter-spacing:.04em; margin-bottom:10px;}

  #shareCanvas{display:none;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#151a23; border:1px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:100px; font-size:13.5px; z-index:20;
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="ecg-wrap" aria-hidden="true">
  <svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
    <path class="ecg-line" d="M0,100 L150,100 L175,100 L190,40 L205,160 L220,20 L235,100 L260,100 L400,100 L420,100 L440,60 L460,140 L480,20 L500,100 L520,100 L900,100" />
  </svg>
</div>

<div id="app">

  <!-- SCREEN 1: LANDING -->
  <section id="landing" class="screen">
    <div class="siren">🚨</div>
    <h1 class="landing-title">What's your<br>ER personality?</h1>
    <p class="landing-sub">Your shift doesn't define you. Your ER personality does.</p>
    <button class="cta-primary" id="startBtn">START THE CHAOS →</button>
    <p class="landing-foot">7 questions · 30 seconds · zero judgment</p>
  </section>

  <!-- SCREEN 2: QUIZ -->
  <section id="quiz" class="screen hidden">
    <div class="progress-row">
      <span class="qcount" id="qcount">QUESTION 1 / 7</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:14.28%"></div></div>
    <h2 class="question-text" id="questionText"></h2>
    <div class="answers" id="answers"></div>
    <div class="quiz-nav">
      <button class="back-link" id="backBtn">← back</button>
    </div>
  </section>

  <!-- SCREEN 3: LOADING -->
  <section id="loading" class="screen hidden">
    <div class="pulse-ring"></div>
    <p class="loading-text">ANALYZING YOUR ER BRAIN 🧠</p>
  </section>

  <!-- SCREEN 4: RESULT -->
  <section id="result" class="screen hidden">
    <p class="result-kicker">YOUR ER PERSONALITY IS…</p>
    <div class="result-emoji" id="resultEmoji"></div>
    <h2 class="result-name" id="resultName"></h2>
    <p class="result-line" id="resultLine"></p>
    <div class="trait-grid" id="traitGrid"></div>
    <div class="quote-block" id="quoteBlock"></div>
    <button class="share-btn" id="shareBtn">📸 SHARE MY RESULT</button>
    <button class="retake-btn" id="retakeBtn">TRY AGAIN</button>
    <p class="disclaimer">Just for fun — not a validated psychological assessment.</p>
    <p class="handle">tea.and.toxins</p>
  </section>

</div>

<canvas id="shareCanvas" width="1080" height="1350"></canvas>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------- DATA ----------
  // Edit questions / options here. Each option: { text, points: {typeKey: value, ...} }
  const QUESTIONS = [
    {
      q: "You walk into the ER and see 25 patients waiting. Your first thought is…",
      options: [
        { t: "\u201COkay. Let\u2019s prioritize.\u201D", p: { A: 2, F: 1 } },
        { t: "\u201CWho ordered this chaos?\u201D", p: { S: 2, G: 1 } },
        { t: "\u201CInteresting\u2026 let\u2019s see what happens.\u201D", p: { C: 2, D: 1 } },
        { t: "\u201CWhere\u2019s the coffee?\u201D", p: { P: 2, I: 1 } }
      ]
    },
    {
      q: "A patient says: \u201CDoctor, it\u2019s just gas.\u201D Your brain immediately says…",
      options: [
        { t: "\u201CCould still be ACS.\u201D", p: { D: 2, A: 1 } },
        { t: "\u201CHere we go again.\u201D", p: { S: 2, P: 1 } },
        { t: "\u201CLet\u2019s investigate.\u201D", p: { D: 2, G: 1 } },
        { t: "\u201CPlease don\u2019t say that.\u201D", p: { P: 2, C: 1 } }
      ]
    },
    {
      q: "Your favorite moment in the ER is…",
      options: [
        { t: "Cracking a difficult diagnosis", p: { D: 2, A: 1 } },
        { t: "Getting ROSC", p: { G: 2, F: 1 } },
        { t: "Finally clearing the waiting room", p: { A: 2, P: 1 } },
        { t: "Going home", p: { P: 2, S: 1 } }
      ]
    },
    {
      q: "Your senior asks: \u201CWhat\u2019s your differential?\u201D",
      options: [
        { t: "\u201CI have 12 possibilities.\u201D", p: { D: 2, C: 1 } },
        { t: "\u201CGive me 30 seconds.\u201D", p: { F: 2, G: 1 } },
        { t: "\u201CThe dangerous diagnoses first.\u201D", p: { A: 2, F: 1 } },
        { t: "\u201CCan we discuss this after coffee?\u201D", p: { P: 2, I: 1 } }
      ]
    },
    {
      q: "Your ideal ER shift would be…",
      options: [
        { t: "Complex cases all day", p: { D: 2, G: 1 } },
        { t: "Everything under control", p: { A: 2, F: 1 } },
        { t: "AI doing the boring work", p: { I: 2, P: 1 } },
        { t: "Nobody needing anything from me", p: { S: 2, P: 1 } }
      ]
    },
    {
      q: "At 3 AM, your patient suddenly deteriorates. You…",
      options: [
        { t: "Become extremely focused", p: { F: 2, G: 1 } },
        { t: "Start running the algorithm", p: { A: 2, D: 1 } },
        { t: "Somehow become more energetic", p: { C: 2, G: 1 } },
        { t: "Question every life decision that brought you here", p: { S: 2, P: 1 } }
      ]
    },
    {
      q: "Your relationship with the ER is basically…",
      options: [
        { t: "\u201CIt\u2019s complicated.\u201D", p: { C: 2, S: 1 } },
        { t: "\u201CI thrive here.\u201D", p: { G: 2, F: 1 } },
        { t: "\u201CI love the medicine, hate the chaos.\u201D", p: { D: 2, P: 1 } },
        { t: "\u201CWe\u2019re currently on a break.\u201D", p: { P: 2, S: 1 } }
      ]
    }
  ];

  // Fixed tie-break priority (deterministic)
  const PRIORITY = ["G","D","A","C","I","F","P","S"];

  const PERSONALITIES = {
    G: {
      name: "The Resus Goblin",
      emoji: "\uD83D\uDD25",
      line: "You come alive when everything is falling apart.",
      traits: ["Loves high-acuity cases","Fast decision maker","Comfortable with chaos","Owns too many airway gadgets"],
      quote: "You don\u2019t enter chaos.<br><span>Chaos enters your shift.</span>"
    },
    D: {
      name: "The Differential Machine",
      emoji: "\uD83E\uDDE0",
      line: "You don\u2019t have a differential. You have a differential tree.",
      traits: ["Loves difficult diagnoses","Sharp pattern recognition","Always asking \u201Cwhat am I missing?\u201D","Turns abdo pain into 14 diagnoses"],
      quote: "Every symptom is a plot twist,<br><span>and you\u2019re already three chapters ahead.</span>"
    },
    A: {
      name: "The Algorithm Warrior",
      emoji: "\u2694\uFE0F",
      line: "ABCDE is basically your operating system.",
      traits: ["Structured","Calm under pressure","Loves protocols","Runs algorithms while brushing teeth"],
      quote: "No panic. No shortcuts.<br><span>Just the next step, done right.</span>"
    },
    C: {
      name: "The Chaos Surfer",
      emoji: "\uD83C\uDF0A",
      line: "You somehow function better when everything is on fire.",
      traits: ["Adaptable","Improvises on the fly","Thrives in unpredictability","Survives impossible shifts"],
      quote: "The plan changed five times.<br><span>You were ready for all five.</span>"
    },
    I: {
      name: "The AI-Powered Doc",
      emoji: "\uD83E\uDD16",
      line: "Why manually do something AI can do in 4 seconds?",
      traits: ["Loves technology","Automates repetitive work","Curious about AI in medicine","Wants less unnecessary exhaustion"],
      quote: "You didn\u2019t skip the paperwork.<br><span>You just outsourced it.</span>"
    },
    F: {
      name: "The Flow State Doc",
      emoji: "\u26A1",
      line: "Give you a sick patient and suddenly everything goes quiet.",
      traits: ["Extremely focused in emergencies","Action-oriented","Blocks out distractions","Best when decisions matter most"],
      quote: "The room got loud.<br><span>You got quieter.</span>"
    },
    P: {
      name: "The Peace-Seeking Resident",
      emoji: "\u2615",
      line: "You love emergency medicine. You just don\u2019t love ED chaos.",
      traits: ["Values efficiency","Wants predictable workflows","Appreciates calm","Dreams of leaving on time"],
      quote: "You didn\u2019t ask for a war zone.<br><span>You asked for a workflow.</span>"
    },
    S: {
      name: "The Legendary Survivor",
      emoji: "\uD83D\uDC80",
      line: "You\u2019ve seen enough things to stop being surprised.",
      traits: ["Experienced-shift energy","Nothing shocks you anymore","Survived impossible nights","Runs on caffeine and trauma"],
      quote: "\u201CI\u2019ve seen worse\u201D<br><span>is basically your whole personality.</span>"
    }
  };

  // ---------- STATE ----------
  let current = 0;
  let selections = new Array(QUESTIONS.length).fill(null); // stores option index per question
  let locked = false; // prevents double advance

  // ---------- ELEMENTS ----------
  const landing = document.getElementById("landing");
  const quiz = document.getElementById("quiz");
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");

  const startBtn = document.getElementById("startBtn");
  const backBtn = document.getElementById("backBtn");
  const qcount = document.getElementById("qcount");
  const progressFill = document.getElementById("progressFill");
  const questionText = document.getElementById("questionText");
  const answersEl = document.getElementById("answers");

  const resultEmoji = document.getElementById("resultEmoji");
  const resultName = document.getElementById("resultName");
  const resultLine = document.getElementById("resultLine");
  const traitGrid = document.getElementById("traitGrid");
  const quoteBlock = document.getElementById("quoteBlock");
  const shareBtn = document.getElementById("shareBtn");
  const retakeBtn = document.getElementById("retakeBtn");
  const toast = document.getElementById("toast");

  function showScreen(el){
    [landing, quiz, loading, result].forEach(s => s.classList.add("hidden"));
    el.classList.remove("hidden");
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  // ---------- QUIZ FLOW ----------
  function startQuiz(){
    current = 0;
    selections = new Array(QUESTIONS.length).fill(null);
    renderQuestion();
    showScreen(quiz);
  }

  function renderQuestion(){
    const data = QUESTIONS[current];
    qcount.textContent = "QUESTION " + (current + 1) + " / " + QUESTIONS.length;
    progressFill.style.width = (((current + 1) / QUESTIONS.length) * 100) + "%";
    questionText.textContent = data.q;
    backBtn.style.visibility = current === 0 ? "hidden" : "visible";

    answersEl.innerHTML = "";
    const letters = ["A","B","C","D"];
    data.options.forEach((opt, i) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "answer-card";
      card.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt.t + '</span>';
      card.addEventListener("click", () => selectAnswer(i, card));
      answersEl.appendChild(card);
    });

    quiz.style.animation = "none";
    void quiz.offsetWidth;
    quiz.style.animation = "fadeIn .4s ease both";
  }

  function selectAnswer(index, cardEl){
    if (locked) return;
    locked = true;
    selections[current] = index;
    cardEl.classList.add("selected");

    setTimeout(() => {
      if (current < QUESTIONS.length - 1){
        current += 1;
        locked = false;
        renderQuestion();
      } else {
        showLoadingThenResult();
      }
    }, 320);
  }

  function goBack(){
    if (current === 0) return;
    current -= 1;
    locked = false;
    renderQuestion();
  }

  function showLoadingThenResult(){
    showScreen(loading);
    setTimeout(() => {
      renderResult(computeResult());
      showScreen(result);
      locked = false;
    }, 1100);
  }

  // ---------- SCORING ----------
  function computeResult(){
    const totals = { G:0, D:0, A:0, C:0, I:0, F:0, P:0, S:0 };
    selections.forEach((optIndex, qIndex) => {
      if (optIndex === null) return;
      const pts = QUESTIONS[qIndex].options[optIndex].p;
      Object.keys(pts).forEach(k => { totals[k] += pts[k]; });
    });
    let best = PRIORITY[0];
    let bestScore = -1;
    PRIORITY.forEach(key => {
      if (totals[key] > bestScore){
        bestScore = totals[key];
        best = key;
      }
    });
    return best;
  }

  function renderResult(key){
    const p = PERSONALITIES[key];
    resultEmoji.textContent = p.emoji;
    resultName.textContent = p.name;
    resultLine.textContent = "\u201C" + p.line + "\u201D";
    traitGrid.innerHTML = p.traits.slice(0,4).map(t => '<div class="trait-card">' + t + '</div>').join("");
    quoteBlock.innerHTML = p.quote;
    result.dataset.key = key;
  }

  // ---------- SHARE CARD ----------
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words = text.split(" ");
    let line = "";
    let yy = y;
    const lines = [];
    for (let n = 0; n < words.length; n++){
      const testLine = line + words[n] + " ";
      if (ctx.measureText(testLine).width > maxWidth && n > 0){
        lines.push(line.trim());
        line = words[n] + " ";
      } else {
        line = testLine;
      }
    }
    lines.push(line.trim());
    lines.forEach((l, i) => ctx.fillText(l, x, yy + i * lineHeight));
    return lines.length * lineHeight;
  }

  function buildShareCanvas(key){
    const p = PERSONALITIES[key];
    const canvas = document.getElementById("shareCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;

    // background
    const grad = ctx.createRadialGradient(W*0.5, H*0.05, 0, W*0.5, H*0.05, W*0.9);
    grad.addColorStop(0, "#1a0e12");
    grad.addColorStop(1, "#090c11");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // soft red glow blob
    const glow = ctx.createRadialGradient(W*0.5, H*0.02, 0, W*0.5, H*0.02, W*0.65);
    glow.addColorStop(0, "rgba(255,54,83,0.20)");
    glow.addColorStop(1, "rgba(255,54,83,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    // border frame
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 3;
    ctx.strokeRect(28,28,W-56,H-56);

    // eyebrow
    ctx.fillStyle = "#ff3653";
    ctx.font = "600 30px 'Space Grotesk', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("WHAT'S MY ER PERSONALITY?", W/2, 190);

    // emoji
    ctx.font = "170px sans-serif";
    ctx.fillText(p.emoji, W/2, 420);

    // name
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 74px 'Space Grotesk', sans-serif";
    wrapText(ctx, p.name, W/2, 520, W-160, 82);

    // line
    ctx.fillStyle = "#c7cbd6";
    ctx.font = "italic 400 36px 'Inter', sans-serif";
    let lineY = p.name.length > 20 ? 700 : 640;
    lineY = wrapText(ctx, "\u201C" + p.line + "\u201D", W/2, lineY, W-200, 48) + lineY - 30;

    // traits
    let ty = lineY + 60;
    ctx.textAlign = "left";
    p.traits.slice(0,3).forEach((t) => {
      ctx.fillStyle = "#ff3653";
      ctx.font = "700 34px 'Space Grotesk', sans-serif";
      ctx.fillText("\u2022", 130, ty);
      ctx.fillStyle = "#e7e9ee";
      ctx.font = "500 34px 'Inter', sans-serif";
      ctx.fillText(t, 168, ty);
      ty += 58;
    });

    // footer handle
    ctx.textAlign = "center";
    ctx.fillStyle = "#6b7180";
    ctx.font = "600 30px 'Inter', sans-serif";
    ctx.fillText("tea.and.toxins", W/2, H-90);
    ctx.fillStyle = "#454a58";
    ctx.font = "400 22px 'Inter', sans-serif";
    ctx.fillText("not a validated psychological assessment \u2014 just for fun", W/2, H-56);

    return canvas;
  }

  async function handleShare(){
    const key = result.dataset.key;
    if (!key) return;

    // ensure fonts are ready before drawing crisp text
    if (document.fonts && document.fonts.ready){
      try { await document.fonts.ready; } catch(e){}
    }
    const canvas = buildShareCanvas(key);

    canvas.toBlob(async (blob) => {
      if (!blob) { showToast("Couldn't generate the image \u2014 try again."); return; }
      const fileName = "er-personality-" + key.toLowerCase() + ".png";
      const file = new File([blob], fileName, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({
            files: [file],
            title: "My ER Personality",
            text: "I'm " + PERSONALITIES[key].name + " " + PERSONALITIES[key].emoji + " \u2014 what's yours?"
          });
          return;
        } catch(err){
          // user cancelled or share failed — fall through to download
        }
      }
      // fallback: offer the file via the platform's save capability
      try{
        const downloads = (window.claude && typeof window.claude.use === "function")
          ? await window.claude.use("downloads")
          : null;
        if (downloads){
          const res = await downloads.save({ filename: fileName, data: blob });
          showToast(res.status === "delivered" ? "Sent \uD83D\uDCF8" : "Image saved \u2014 share it from your gallery \uD83D\uDCF8");
          return;
        }
      } catch(err){
        if (err && err.code === "declined"){ return; }
        // otherwise fall through to the plain-browser download below
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      showToast("Image saved \u2014 share it from your gallery \uD83D\uDCF8");
    }, "image/png", 0.95);
  }

  function retake(){
    startQuiz();
  }

  // ---------- INIT ----------
  startBtn.addEventListener("click", startQuiz);
  backBtn.addEventListener("click", goBack);
  shareBtn.addEventListener("click", handleShare);
  retakeBtn.addEventListener("click", retake);

})();
</script>
